<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOMORO COFFEE - Landing Page</title>
    <meta name="author" content="I Putu Eko Gotama wita">
    <meta name="keyword" content="Belajar css, tugas praktikum">
    <meta name="description" content="halaman tugas praktikum pengenalan css lanjut">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="container nav-container">
        <a href="#" class="logo">
            <svg class="logo-icon" viewBox="0 0 40 40">
                <path d="M8 32V14l6-6 6 6v18H8zm2-2h4V16l-2-2-2 2v14zm12 2V14l6-6 6 6v18H22zm2-2h4V16l-2-2-2 2v14z"/>

            <div class="logo-text">

                <span class="brand-sub">COFFEE</span>
            </div>
        </a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
        <ul class="nav-links" id="navLinks">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Kemitraan</a></li>
            <li><a href="#">Download App</a></li>
        </ul>
    </div>
</header>
<main class="hero">
    <div class="container hero-container">
        <div class="hero-text">
            <div class="hey-badge">HEY!</div>
            <h1>ENJOY YOUR COFFEE TIME!</h1>
            <p class="subtitle">100% ARABICA COFFEE<br>FRESHLY ROASTED AND BREWED</p>
            <div class="hashtag">@TOMORO</div>
        </div>
        <div class="hero-graphics">
            <svg class="bg-lines" viewBox="0 0 500 400" fill="none" stroke="#f2a282" stroke-width="1.5">
          <path d="M50 200 L70 120 L100 150 L130 120 L150 200 Z" opacity="0.4" />
          <path d="M120 300 L140 250 L160 270 L180 250 L200 300 Z" opacity="0.3" />
          <path d="M300 150 L330 60 L370 100 L410 60 L440 150 Z" opacity="0.4" />
          <ellipse cx="280" cy="180" rx="35" ry="50" transform="rotate(-25 280 180)" opacity="0.3" />
          <path d="M265 135 C 280 170, 280 190, 295 225" opacity="0.3" />
        </svg>
        <div class="orange-badge-top"></div>
        <div class="coffee-bean-solid"></div>
        <div class="cup wrapper">
            <div class="orang-circle-bg"></div>
            <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=600&q=80" alt="Tomoro Coffee Cup" class="cup-img">
        </div>
        </div>
    </div>
</main>
<footer class="footer">
    <div class="container footer-container">
        <div class="footer-contact">
            <div class="qr-code">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <div class="contact-details">
                <span>Contact Us</span>
                <span class="phone">0811-1051-0332</span>
                <a href="mailto:hitomoro@tomoro-coffee.com" class="email">hitomoro@tomoro-coffee.com</a>
            </div>
        </div>
        <div class="footer-right">
            <div class="social-icons">
                <a href="#" class="icon-btn" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="icon-btn" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                <a href="#" class="icon-btn" aria-label="Threads"><i class="fa-brands fa-threads"></i></a>
            </div>
            <p class="copyright">© 2026 TOMORO COFFEE. All rights reserved. • <a href="#">Terms and Conditions</a> • <a href="#">Privacy Policy</a></p>
        </div>
    </div>
</footer>
<script>
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');

    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
    });
  </script>

</html>
